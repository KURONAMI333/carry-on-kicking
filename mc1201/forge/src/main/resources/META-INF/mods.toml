modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://www.curseforge.com/minecraft/mc-mods/carry-on-kicking/comments"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "logo.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/carry-on-kicking"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "carryon"
mandatory = true
versionRange = "[2.1.2.7,)"
ordering = "AFTER"
side = "BOTH"
