plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

obfuscation {
    // Published Forge mods use SRG names; the development game uses official names.
    createRemappingConfiguration(configurations.localRuntime)
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo sourceSets.gametest
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            loadedMods = [project.legacyForge.mods.getByName(mod_id)]
        }
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [project.legacyForge.mods.getByName(mod_id),
                          project.legacyForge.mods.getByName("${mod_id}_gametest")]
        }
    }

}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    compileOnly "tschipp.carryon:carryon-common-1.20.1:${carryon_common_version}"
    modLocalRuntime "tschipp.carryon:carryon-forge-1.20.1:${carryon_loader_version}"
    // Carry On's nested MixinExtras is not extracted by the dev launch classpath.
    localRuntime 'com.github.llamalad7.mixinextras:mixinextras-forge:0.2.0-beta.6'
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}
